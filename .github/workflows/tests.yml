name: tests

# Runs on every pull request and on main. A pull request from a fork gets a read-only token and no secrets.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest, Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      # The browser tests need a real Chromium. Without it 66 of them are skipped and the core of the app goes untested.
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Test
        run: python -m pytest -q -rfs -p no:cacheprovider -n auto

  ui:
    name: ui (vitest + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc -b
